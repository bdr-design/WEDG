name: marah
description: "مراح: لعبة ملاك الإبل والمزاين"
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  marah_domain: any
  marah_data: any
  shared_preferences: ^2.5.6
  path_provider: ^2.1.6
  marah_runtime: any

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/camels/
    - assets/scenes/

  fonts:
    - family: Plex
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
    - family: ReemKufi
      fonts:
        - asset: assets/fonts/ReemKufi.ttf
