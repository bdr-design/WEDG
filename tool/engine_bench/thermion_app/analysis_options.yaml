include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    unawaited_futures: error
  exclude:
    - build/**
    - android/**

linter:
  rules:
    # The benchmark reports through print(): it reaches logcat under the
    # `flutter` tag, where CI collects the BENCH lines.
    avoid_print: false
    unawaited_futures: true
