# Standalone benchmark app: its own lints, not the workspace's.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    unawaited_futures: error
  exclude:
    - "build/**"
    - android/**

linter:
  rules:
    - directives_ordering
    - discarded_futures
    - prefer_final_locals
    - prefer_single_quotes
    - unawaited_futures
