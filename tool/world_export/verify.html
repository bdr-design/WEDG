<!doctype html><meta charset="utf-8"><title>yard check</title>
<style>html,body{margin:0;height:100%;background:#b98a5e}canvas{display:block}</style>

<script type="module">
// Loads only the exported, engine-neutral files (terrain.glb, yard.glb, scatter, vehicles) to check the port.

import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    m.compose(new THREE.Vector3(f.x, f.y ?? +k.y, f.z), q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), f.yaw ?? 0), new THREE.Vector3(f.scale_xz ?? f.scale ?? 1, f.scale_y ?? f.scale ?? 1, f.scale_xz ?? f.scale ?? 1));
    im.setMatrixAt(i, m); if (f.r !== undefined) im.setColorAt(i, c.setRGB(f.r, f.g, f.b));

window.__done = { ms: Math.round(performance.now() - t0), draws: r.info.render.calls, tris: r.info.render.triangles, instances: inst, vehicles: vj.vehicles.length };
