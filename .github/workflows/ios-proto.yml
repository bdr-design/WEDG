name: iOS prototype app

# Builds tool/proto_app (the 3D prototype in design/prototype3d inside an iPhone
# app, with the game's rules engine compiled for its worker from tool/proto_engine
# and packages/) on a macOS runner and uploads the IPA as the run's artifact.
#
# Signed with the repository's secrets when they are set (Settings > Secrets and
# variables > Actions); without them it builds an unsigned IPA (to sign and
# install yourself, e.g. with Sideloadly):
#   IOS_P12_BASE64      the signing certificate and its key (.p12), base64
#   IOS_P12_PASSWORD    the .p12's password
#   IOS_PROFILE_BASE64  the provisioning profile (.mobileprovision), base64
# The bundle ID, team and export method are read from the profile.

on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: ["design/prototype3d/**", "tool/proto_app/**", "tool/proto_engine/**", "packages/**", ".github/workflows/ios-proto.yml"]

concurrency:
  group: ios-proto-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.8"

jobs:
  ipa:
    name: Build the IPA
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Bundle the prototype (and the rules engine compiled for its worker)
        run: |
          flutter pub get
          python3 tool/proto_app/assemble.py

      - name: Test the app's server
        working-directory: tool/proto_app
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Signing
        env:
          P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          if [ -z "$P12_BASE64" ] || [ -z "$PROFILE_BASE64" ]; then
            echo "::warning::No signing secrets: building an unsigned IPA."
            echo "SIGNED=0" >> "$GITHUB_ENV"; exit 0
          fi
          KC="$RUNNER_TEMP/sign.keychain-db"; KCPW="$(openssl rand -hex 16)"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KCPW" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          IDENTITY="$(security find-identity -v -p codesigning "$KC" | awk '/^ *[0-9]+\)/ {print $2; exit}')"      # (the first numbered identity; with none the tool prints only "0 valid identities found"
          [ -n "$IDENTITY" ] || { echo "::error::No signing identity in the .p12 (is the password right, and does it hold the private key?)"; exit 1; }

          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PB() { /usr/libexec/PlistBuddy -c "Print :$1" "$RUNNER_TEMP/profile.plist" 2>/dev/null; }
          UUID="$(PB UUID)"; NAME="$(PB Name)"; TEAM="$(PB TeamIdentifier:0)"; APPID="$(PB Entitlements:application-identifier)"; EXPIRY="$(PB ExpirationDate)"
          BUNDLE="${APPID#*.}"
          case "$BUNDLE" in '*') BUNDLE="com.bdrdesign.marahproto" ;; *'*') BUNDLE="${BUNDLE%\*}marahproto" ;; esac
          if PB ProvisionsAllDevices > /dev/null; then METHOD=enterprise
          elif PB ProvisionedDevices > /dev/null; then
            if [ "$(PB Entitlements:get-task-allow)" = "true" ]; then METHOD=development; else METHOD=ad-hoc; fi
          else METHOD=app-store; fi
          DEVICES="$(PB ProvisionedDevices | grep -c '^ ' || true)"
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d"; cp "$RUNNER_TEMP/profile.mobileprovision" "$d/$UUID.mobileprovision"
          done
          {
            echo "SIGNED=1"; echo "KC=$KC"; echo "IDENTITY=$IDENTITY"; echo "TEAM=$TEAM"; echo "UUID=$UUID"
            echo "BUNDLE=$BUNDLE"; echo "METHOD=$METHOD"
          } >> "$GITHUB_ENV"
          {
            echo "### Signing"
            echo "- Signed for $METHOD install, the profile expires $EXPIRY"
            echo "(The repository is public: the profile's name, team and devices are left out of this summary.)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set the app's signing (Runner target only)
        if: env.SIGNED == '1'
        working-directory: tool/proto_app
        run: |
          python3 - <<'PY'
          import os, re
          p = 'ios/Runner.xcodeproj/project.pbxproj'
          s = open(p).read()
          old = 'PRODUCT_BUNDLE_IDENTIFIER = com.bdrdesign.marahProto;'
          assert s.count(old) == 3, 'expected the Runner target\'s three configurations'
          e = os.environ
          new = (f'CODE_SIGN_STYLE = Manual;\n\t\t\t\tDEVELOPMENT_TEAM = {e["TEAM"]};\n\t\t\t\t'
                 f'PROVISIONING_PROFILE_SPECIFIER = "{e["UUID"]}";\n\t\t\t\t'
                 f'CODE_SIGN_IDENTITY = "{e["IDENTITY"]}";\n\t\t\t\t"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "{e["IDENTITY"]}";\n\t\t\t\t'
                 f'PRODUCT_BUNDLE_IDENTIFIER = {e["BUNDLE"]};')
          open(p, 'w').write(s.replace(old, new))
          PY
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>$METHOD</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>$IDENTITY</string>
            <key>provisioningProfiles</key><dict><key>$BUNDLE</key><string>$UUID</string></dict>
            <key>compileBitcode</key><false/>
          </dict></plist>
          PLIST

      - name: Build (signed)
        if: env.SIGNED == '1'
        working-directory: tool/proto_app
        run: |
          flutter build ipa --release --build-number "${{ github.run_number }}" --export-options-plist "$RUNNER_TEMP/ExportOptions.plist"
          mkdir -p "$RUNNER_TEMP/out"
          cp build/ios/ipa/*.ipa "$RUNNER_TEMP/out/marah-proto-$METHOD.ipa"

      - name: Build (unsigned)
        if: env.SIGNED != '1'
        working-directory: tool/proto_app
        run: |
          flutter build ios --release --no-codesign --build-number "${{ github.run_number }}"
          mkdir -p "$RUNNER_TEMP/out/Payload"
          cp -R build/ios/iphoneos/Runner.app "$RUNNER_TEMP/out/Payload/"
          (cd "$RUNNER_TEMP/out" && zip -qr marah-proto-unsigned.ipa Payload && rm -rf Payload)

      - uses: actions/upload-artifact@v4
        with:
          name: marah-proto-ipa
          path: ${{ runner.temp }}/out/*.ipa
          retention-days: 14
          if-no-files-found: error

      - name: Remove the signing keychain
        if: always() && env.SIGNED == '1'
        run: security delete-keychain "$KC" || true
