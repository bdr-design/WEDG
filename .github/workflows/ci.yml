name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.8"

jobs:
  checks:
    name: Format, analyze, test, simulate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Format
        run: dart format --output=none --set-exit-if-changed packages apps/marah/lib apps/marah/test tool/proto_engine

      - name: Analyze (infos are errors)
        run: |
          (cd packages/marah_domain && dart analyze --fatal-infos)
          (cd packages/marah_data && dart analyze --fatal-infos)
          (cd packages/marah_runtime && dart analyze --fatal-infos)
          (cd packages/marah_store && dart analyze --fatal-infos)
          (cd tool/proto_engine && dart analyze --fatal-infos)
          (cd apps/marah && flutter analyze --fatal-infos)

      - name: Domain tests with coverage floor
        working-directory: packages/marah_domain
        run: |
          dart test --coverage=coverage
          dart pub global activate coverage 1.11.1
          dart pub global run coverage:format_coverage --lcov --in=coverage --out=coverage/lcov.info --report-on=lib
          python3 ../../tool/coverage_floor.py coverage/lcov.info 85
          # and compiled to JavaScript, as the 3D prototype's worker runs it
          dart test -p node

      - name: Save format tests (golden saves must load)
        working-directory: packages/marah_data
        run: dart test

      - name: SQLite store tests (exact reload, incremental writes, 10k head)
        working-directory: packages/marah_store
        run: dart test

      - name: Runtime tests (worker isolate, paging, recovery, budgets)
        working-directory: packages/marah_runtime
        run: dart test

      - name: Prototype engine (the same game on the Dart VM and in JavaScript)
        working-directory: tool/proto_engine
        run: |
          dart test -p vm,node
          dart compile js -O2 bin/same_seed.dart -o "$RUNNER_TEMP/same_seed.js"
          node "$RUNNER_TEMP/same_seed.js" > "$RUNNER_TEMP/js.txt"
          dart run bin/same_seed.dart > "$RUNNER_TEMP/vm.txt"
          # two years of the scripted bot and the commands it never sends, the whole state hashed every 4 weeks
          diff <(sed '/--save--/,$d' "$RUNNER_TEMP/vm.txt") <(sed '/--save--/,$d' "$RUNNER_TEMP/js.txt")
          # the save JavaScript wrote, read on the VM, is the same state
          vm_end=$(sed '/--save--/,$d' "$RUNNER_TEMP/vm.txt" | grep '^week' | tail -1 | grep -o 'length .*')
          js_read=$(dart run bin/read_save.dart "$RUNNER_TEMP/js.txt")
          echo "VM: $vm_end / JS save read on the VM: $js_read"
          test -n "$vm_end" && test "$vm_end" = "$js_read"
          # each command the bot never sends went through at least once
          for c in buyListing cancelListing declineOffer listForSale mateWithOwnBull renameCamel setCalfShare setFeedPlan withdrawEntry; do
            grep '^extras' "$RUNNER_TEMP/vm.txt" | grep -Eq "$c [1-9]" || { echo "$c never went through"; exit 1; }
          done
          # the worker the prototype loads compiles, answers in node with a fake page, and the page's own side
          # (design/prototype3d/engine.js) works with it both ways the save is kept
          python3 build_worker.py "$RUNNER_TEMP/engine_worker.js"
          node test_js/worker_smoke.cjs "$RUNNER_TEMP/engine_worker.js"
          node test_js/engine_page.mjs "$RUNNER_TEMP/engine_worker.js"

      - name: App tests
        working-directory: apps/marah
        run: flutter test

      - name: 10-year simulation, invariants every week
        working-directory: packages/marah_domain
        run: dart run marah_domain:simulate 10 4

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Android (debug APK)
        working-directory: apps/marah
        run: flutter build apk --debug

  build-ios:
    name: Build iOS (simulator, unsigned)
    runs-on: macos-latest
    needs: checks
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - working-directory: apps/marah
        run: flutter build ios --simulator --debug --no-codesign
