name: Engine bench

# Builds each candidate renderer's benchmark app (tool/engine_bench), reports its
# release APK size against an empty Flutter app, and runs it on an Android
# emulator to collect the BENCH lines (startup, frame times, memory).

on:
  push:
    branches: ["claude/**"]
    paths: ["tool/engine_bench/**", ".github/workflows/engine-bench.yml"]
  workflow_dispatch:

concurrency:
  group: engine-bench-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.8"

jobs:
  bench:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        app: [baseline, flutter_scene_app, thermion_app]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Prepare app
        id: app
        run: |
          if [ "${{ matrix.app }}" = "baseline" ]; then
            flutter create --org com.marah.bench --project-name baseline --platforms android "$RUNNER_TEMP/baseline"
            echo "dir=$RUNNER_TEMP/baseline" >> "$GITHUB_OUTPUT"
          else
            if [ ! -f "tool/engine_bench/${{ matrix.app }}/pubspec.yaml" ]; then echo "not there yet"; echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0; fi
            echo "dir=$GITHUB_WORKSPACE/tool/engine_bench/${{ matrix.app }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Release APK size (arm64)
        if: steps.app.outputs.skip != '1'
        working-directory: ${{ steps.app.outputs.dir }}
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi
          ls -l build/app/outputs/flutter-apk/
          SIZE=$(stat -c %s build/app/outputs/flutter-apk/app-arm64-v8a-release.apk)
          echo "BENCH_SIZE {\"app\":\"${{ matrix.app }}\",\"arm64_apk_bytes\":$SIZE}" | tee -a "$RUNNER_TEMP/bench.txt"

      - name: Emulator build (x86_64)
        if: steps.app.outputs.skip != '1' && matrix.app != 'baseline'
        working-directory: ${{ steps.app.outputs.dir }}
        run: flutter build apk --release --target-platform android-x64

      - name: Enable KVM
        if: steps.app.outputs.skip != '1' && matrix.app != 'baseline'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on the emulator
        if: steps.app.outputs.skip != '1' && matrix.app != 'baseline'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          working-directory: ${{ steps.app.outputs.dir }}
          script: bash "$GITHUB_WORKSPACE/tool/engine_bench/run_on_emulator.sh" build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/bench.txt"

      - name: Results
        if: always()
        run: cat "$RUNNER_TEMP/bench.txt" 2>/dev/null || echo "no results"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-${{ matrix.app }}
          path: |
            ${{ runner.temp }}/bench.txt
            ${{ runner.temp }}/logcat.txt
          if-no-files-found: ignore
