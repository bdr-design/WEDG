name: marah_store
description: "SQLite save store for Marah - incremental writes, transactions, migrations and backups. Pure Dart (package:sqlite3), for devices and a server."
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  marah_data: any
  marah_domain: any
  sqlite3: ">=3.8.0 <3.9.0"

dev_dependencies:
  test: ^1.25.0
